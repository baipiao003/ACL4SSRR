name: 更新反代IP库
on:
  workflow_dispatch:
  schedule:    
    - cron: '30 21 * * 3'  # 每周三 21:30 UTC 执行（北京时间周四 05:30）

env:
  IP_URL: "https://zip.cm.edu.kg/all.txt"
  IP_FILENAME: "baipiao.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v6

      - name: 检查 URL 状态
        id: check_url
        run: |
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.IP_URL }}")
          echo "Status code: $STATUS_CODE"
          if [ "$STATUS_CODE" = "200" ]; then
            echo "url_status_ok=true" >> $GITHUB_OUTPUT
            echo "URL 响应正常，状态码为 200"
          else
            echo "url_status_ok=false" >> $GITHUB_OUTPUT
            echo "URL 响应异常，状态码为 $STATUS_CODE，将跳过后续步骤"
          fi

      - name: 下载 IP 库文件
        if: steps.check_url.outputs.url_status_ok == 'true'
        run: |
          curl -L "${{ env.IP_URL }}" -o "${{ env.IP_FILENAME }}"

      - name: 提交更新的IP库文件
        if: steps.check_url.outputs.url_status_ok == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          FILENAME="${{ env.IP_FILENAME }}"

          # 检查文件是否成功下载且不为空
          if [ ! -f "$FILENAME" ] || [ ! -s "$FILENAME" ]; then
            echo "$FILENAME 文件不存在或为空，跳过提交"
            exit 0
          fi
          
          # 修复：先添加进暂存区，解决新文件无法被 git diff 检测到的问题
          git add "$FILENAME"

          # 检查暂存区是否有内容变化
          if git diff --staged --quiet; then
            echo "$FILENAME 文件内容没有变化，无需提交"
          else
            echo "检测到 $FILENAME 文件有更新，开始提交"
            # 优化：使用北京时间作为 commit 记录
            COMMIT_TIME=$(TZ="Asia/Shanghai" date '+%Y-%m-%d %H:%M:%S')
            git commit -m "更新IP库文件 $COMMIT_TIME"
            git push
            echo "提交完成"
          fi
